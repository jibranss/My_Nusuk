<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrasi REST API</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">

  <div class="max-w-2xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-lg shadow">
      <h2 id="form-title" class="text-xl font-bold mb-4">Tambah Produk</h2>
      <form id="product-form" class="space-y-3">
        <input type="hidden" id="product-id">
        <input type="text" id="product-name" placeholder="Nama Produk" required class="w-full p-2 border rounded">
        <input type="number" id="product-price" placeholder="Harga" required class="w-full p-2 border rounded">
        <div class="flex gap-2">
          <button type="submit" id="btn-submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Simpan</button>
          <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden bg-gray-400 text-white px-4 py-2 rounded">Batal</button>
        </div>
      </form>
    </div>

    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-xl font-bold mb-4">Daftar Produk</h2>
      <ul id="product-list" class="divide-y"></ul>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api/products';

    async function fetchProducts() {
      const res = await fetch(API_URL);
      const data = await res.json();
      const list = document.getElementById('product-list');
      list.innerHTML = '';
      
      data.data.forEach(p => {
        list.innerHTML += `
          <li class="py-3 flex justify-between items-center">
            <div>
              <span class="font-bold">${p.name}</span> - Rp ${p.price.toLocaleString('id-ID')}
            </div>
            <div class="space-x-2">
              <button onclick="editProduct(${p.id}, '${p.name}', ${p.price})" class="text-amber-600">Edit</button>
              <button onclick="deleteProduct(${p.id})" class="text-red-600">Hapus</button>
            </div>
          </li>`;
      });
    }

    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('product-id').value;
      const name = document.getElementById('product-name').value;
      const price = document.getElementById('product-price').value;

      const url = id ? `${API_URL}/${id}` : API_URL;
      const method = id ? 'PUT' : 'POST';

      await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price })
      });

      resetForm();
      fetchProducts();
    });

    function editProduct(id, name, price) {
      document.getElementById('product-id').value = id;
      document.getElementById('product-name').value = name;
      document.getElementById('product-price').value = price;
      document.getElementById('form-title').textContent = 'Edit Produk';
      document.getElementById('btn-cancel').classList.remove('hidden');
    }

    async function deleteProduct(id) {
      if (confirm('Hapus produk ini?')) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        fetchProducts();
      }
    }

    function resetForm() {
      document.getElementById('product-id').value = '';
      document.getElementById('product-name').value = '';
      document.getElementById('product-price').value = '';
      document.getElementById('form-title').textContent = 'Tambah Produk';
      document.getElementById('btn-cancel').classList.add('hidden');
    }

    fetchProducts();
  </script>
</body>
</html>
